name: Refresh restaurant details
on:
  workflow_dispatch:
  push:
    paths: ['scripts/refresh.mjs', 'public/curated.json']
  schedule:
    - cron: '17 11 * * *'   # daily, ~5am Houston
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/refresh.mjs
      - name: Commit if changed
        run: |
          git config user.name "downtown-eats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/places.json
          git diff --cached --quiet || (git commit -m "Refresh restaurant details" && git push)
